<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — PixelMind AI</title>
  <meta name="description" content="Log in to your PixelMind AI account and start generating stunning AI images." />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
    }

    .auth-wrapper {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: authIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes authIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: var(--space-3);
      text-decoration: none;
      margin-bottom: var(--space-6);
    }

    .auth-logo-icon {
      width: 44px; height: 44px;
      border-radius: var(--radius-lg);
      background: var(--grad-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: var(--shadow-glow);
    }

    .auth-logo-text {
      font-size: var(--text-2xl);
      font-weight: 700;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-title {
      font-size: var(--text-3xl);
      font-weight: 800;
      margin-bottom: var(--space-2);
    }

    .auth-sub {
      color: var(--text-secondary);
      font-size: var(--text-sm);
    }

    .auth-card {
      padding: var(--space-8);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    .auth-footer-text {
      text-align: center;
      margin-top: var(--space-6);
      font-size: var(--text-sm);
      color: var(--text-muted);
    }

    .auth-footer-text a {
      color: var(--text-accent);
      text-decoration: none;
      font-weight: 600;
      transition: color var(--transition-fast);
    }

    .auth-footer-text a:hover { color: var(--primary-400); }

    .show-password-toggle {
      position: absolute;
      right: var(--space-4);
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 0;
      transition: color var(--transition-fast);
    }

    .show-password-toggle:hover { color: var(--text-secondary); }

    .error-banner {
      padding: var(--space-3) var(--space-4);
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      color: #f87171;
      display: none;
      align-items: center;
      gap: var(--space-2);
    }

    .error-banner.visible { display: flex; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text-muted);
      font-size: var(--text-sm);
      text-decoration: none;
      margin-bottom: var(--space-8);
      transition: color var(--transition-fast);
    }

    .back-link:hover { color: var(--text-accent); }
  </style>
</head>
<body>

<!-- Animated Background -->
<div class="page-bg" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div class="auth-wrapper">
  <a href="index.html" class="back-link" id="back-to-home">← Back to home</a>

  <div class="auth-header">
    <a href="index.html" class="auth-logo" id="auth-logo">
      <div class="auth-logo-icon" aria-hidden="true">✦</div>
      <span class="auth-logo-text">PixelMind AI</span>
    </a>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to continue creating amazing AI art.</p>
  </div>

  <div class="card auth-card">
    <!-- Error Banner -->
    <div class="error-banner" id="error-banner" role="alert" aria-live="polite">
      <span>⚠️</span>
      <span id="error-message">Invalid email or password.</span>
    </div>

    <form class="auth-form" id="login-form" novalidate autocomplete="on">
      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">✉</span>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
            aria-required="true"
          />
        </div>
        <span class="form-error" id="email-error" role="alert" aria-live="polite"></span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <div class="flex-between">
          <label class="form-label" for="password">Password</label>
          <a href="#" id="forgot-password" style="font-size:var(--text-xs); color:var(--text-accent); text-decoration:none;">Forgot password?</a>
        </div>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">🔒</span>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
            aria-required="true"
          />
          <button type="button" class="show-password-toggle" id="toggle-password" aria-label="Toggle password visibility">👁</button>
        </div>
        <span class="form-error" id="password-error" role="alert" aria-live="polite"></span>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary btn-lg w-full" id="login-btn">
        <span class="btn-label">Log In →</span>
      </button>
    </form>

    <div class="divider-text">or</div>

    <div style="text-align:center;">
      <p style="font-size:var(--text-xs); color:var(--text-muted); margin-bottom:var(--space-3);">
        Don't have an account?
      </p>
      <a href="signup.html" class="btn btn-outline w-full" id="goto-signup">
        Create Account Free ✦
      </a>
    </div>
  </div>

  <p class="auth-footer-text">
    By logging in you agree to our <a href="#" id="tos-link">Terms</a> and <a href="#" id="privacy-link">Privacy Policy</a>.
  </p>
</div>

<div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

<script src="js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Already logged in? redirect
    authRedirectIfLoggedIn();

    const form        = document.getElementById('login-form');
    const loginBtn    = document.getElementById('login-btn');
    const emailInput  = document.getElementById('email');
    const passInput   = document.getElementById('password');
    const emailError  = document.getElementById('email-error');
    const passError   = document.getElementById('password-error');
    const errorBanner = document.getElementById('error-banner');
    const errorMsg    = document.getElementById('error-message');
    const togglePass  = document.getElementById('toggle-password');
    const toasts      = document.getElementById('toast-container');

    // Toggle password visibility
    togglePass.addEventListener('click', () => {
      const isText = passInput.type === 'text';
      passInput.type = isText ? 'password' : 'text';
      togglePass.textContent = isText ? '👁' : '🙈';
    });

    // Clear errors on input
    emailInput.addEventListener('input', () => {
      emailInput.classList.remove('error');
      emailError.textContent = '';
      errorBanner.classList.remove('visible');
    });

    passInput.addEventListener('input', () => {
      passInput.classList.remove('error');
      passError.textContent = '';
      errorBanner.classList.remove('visible');
    });

    // Toast helper
    function showToast(msg, type) {
      const icons = { success: '✅', error: '❌', warn: '⚠️' };
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
      toasts.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(60px)';
        t.style.transition = 'all 0.3s ease';
        setTimeout(() => t.remove(), 300);
      }, 3500);
    }

    // Validate fields
    function validate() {
      let valid = true;
      const email = emailInput.value.trim();
      const pass  = passInput.value;

      if (!email) {
        emailInput.classList.add('error');
        emailError.textContent = '⚠ Email is required.';
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailInput.classList.add('error');
        emailError.textContent = '⚠ Please enter a valid email.';
        valid = false;
      }

      if (!pass) {
        passInput.classList.add('error');
        passError.textContent = '⚠ Password is required.';
        valid = false;
      }

      return valid;
    }

    // Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validate()) return;

      loginBtn.classList.add('btn-loading');
      loginBtn.disabled = true;

      // Simulate network delay
      await new Promise(r => setTimeout(r, 800));

      const result = authLogin(emailInput.value.trim(), passInput.value);

      loginBtn.classList.remove('btn-loading');
      loginBtn.disabled = false;

      if (result.success) {
        showToast('Logged in successfully! Redirecting…', 'success');
        loginBtn.querySelector('.btn-label').textContent = '✓ Success!';
        setTimeout(() => { window.location.href = 'query.html'; }, 1000);
      } else {
        errorMsg.textContent = result.message;
        errorBanner.classList.add('visible');
        emailInput.classList.add('error');
        passInput.classList.add('error');
        // Shake animation
        errorBanner.style.animation = 'none';
        requestAnimationFrame(() => {
          errorBanner.style.animation = 'shake 0.4s ease';
        });
      }
    });
  });
</script>
<style>
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-6px); }
    40%       { transform: translateX(6px); }
    60%       { transform: translateX(-4px); }
    80%       { transform: translateX(4px); }
  }
</style>
</body>
</html>
